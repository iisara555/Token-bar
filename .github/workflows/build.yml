name: Build

# Installers are built here rather than on a developer's machine because a
# macOS .dmg can only be produced on macOS — Apple does not allow the SDK to be
# redistributed, so there is no cross-compile for it from Windows or Linux.
# Running both targets here also gets the Rust code compiled and tested on both
# platforms it ships to, on every push.

on:
  push:
    branches: [main]
    # A version tag is what turns a build into a published release. Pushing
    # `v0.2.0` is the whole release procedure; an ordinary push to main still
    # builds and still uploads artifacts, it just does not publish.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Creating a release means writing to the repository, which the default
# read-only token cannot do.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Read in the `if` of the two build steps below. The secrets context is not
    # available there, but the env context is.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal .dmg)
            os: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # One download that runs natively on Apple silicon and on Intel.
            args: --target universal-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
          - name: Windows (.exe installer)
            os: windows-latest
            rust-targets: ""
            args: ""
            bundle-dir: src-tauri/target/release/bundle

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # A Tauri build from cold is most of the wall time here.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Install frontend dependencies
        run: npm ci

      # Fails fast on a type error before spending minutes in the Rust build.
      - name: Type-check and build the frontend
        run: npm run build

      # Cheap, and they fail for the same reasons the Rust tests do, so they
      # belong on the same side of the gate rather than in the advisory job.
      - name: Test the frontend
        run: npm test

      - name: Test
        working-directory: src-tauri
        run: cargo test

      # Two steps rather than one with conditional env, because the bundler
      # decides to import a certificate from the mere *presence* of
      # APPLE_CERTIFICATE. Passing it through empty makes `security import`
      # fail and takes the whole build with it, and there is no way to leave an
      # env var unset from an expression.
      - name: Build the installers (Developer ID)
        if: env.HAS_APPLE_CERT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Baked into the binary via `option_env!` if set; Antigravity's
          # Connect button reports a config error otherwise. Not committed to
          # the repo — see README.
          ANTIGRAVITY_CLIENT_ID: ${{ secrets.ANTIGRAVITY_CLIENT_ID }}
          ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_CLIENT_SECRET }}
        with:
          args: ${{ matrix.args }}
          # Empty on an ordinary push, which is how tauri-action is told not to
          # publish anything. See the note on the ad-hoc step below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Token Bar {0}', github.ref_name) || '' }}
          releaseDraft: false

      - name: Build the installers (ad-hoc signature)
        if: env.HAS_APPLE_CERT != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `-` is the ad-hoc identity, and it is load-bearing rather than
          # cosmetic: an entirely unsigned bundle is killed by the loader on
          # Apple silicon before Gatekeeper ever gets to show a prompt. Add the
          # APPLE_* secrets and the step above takes over, signing with a real
          # Developer ID and notarising.
          APPLE_SIGNING_IDENTITY: "-"
          ANTIGRAVITY_CLIENT_ID: ${{ secrets.ANTIGRAVITY_CLIENT_ID }}
          ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_CLIENT_SECRET }}
        with:
          args: ${{ matrix.args }}
          # A release is published only from a `v*` tag. On every other push
          # these are empty strings, which is tauri-action's own signal to build
          # without publishing — so an ordinary merge to main still gets its
          # installers as run artifacts and nothing appears under Releases.
          #
          # Both matrix legs name the same tag on purpose: the first to finish
          # creates the release and the second uploads its installer alongside,
          # so one release ends up carrying both the .dmg and the .exe.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Token Bar {0}', github.ref_name) || '' }}
          releaseDraft: false

      - name: Confirm the macOS bundle is signed
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="${{ matrix.bundle-dir }}/macos/Token Bar.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app"

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: token-bar-macos-dmg
          path: ${{ matrix.bundle-dir }}/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: token-bar-windows-exe
          path: ${{ matrix.bundle-dir }}/nsis/*-setup.exe
          if-no-files-found: error

  # Quality signal, kept off the critical path: a lint regression should be
  # visible without also withholding the installers.
  lint:
    name: Clippy
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: lint
      - run: npm ci
      - name: ESLint
        run: npm run lint
      # tauri::generate_context! reads ../dist, so the frontend has to exist
      # before anything can typecheck the Rust side.
      - run: npm run build
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check
