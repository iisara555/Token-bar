name: Build

# Installers are built here because the app targets two platforms that neither
# a developer machine nor this repo's CI container can cross-compile for. Every
# run uploads a downloadable installer, so getting a build onto a Windows or
# Mac machine never requires a Rust toolchain locally.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight build irrelevant. Superseded runs are
  # cancelled rather than left to finish and race for the same artifact name.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the things that can fail on any OS, failing on one.
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's Linux backend needs GTK/WebKit headers even to type-check, since
      # the build script and several crates link against them.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci
      - name: Typecheck and build the frontend
        run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    name: ${{ matrix.label }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the other one built.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            artifact: token-bar-windows
            # NSIS only on Windows; tauri.macos.conf.json adds app+dmg on macOS.
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            label: macOS app
            artifact: token-bar-macos
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - run: npm ci

      - name: Bundle
        run: npm run bundle

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
