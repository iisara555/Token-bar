[package]
name = "token-bar"
version = "0.1.0"
description = "Always-on-top AI usage toolbar for macOS and Windows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "token_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what `macOSPrivateApi` in tauri.conf.json compiles
# against. Without it a transparent window on macOS renders opaque black behind
# the rounded pill, so it is load-bearing rather than a nicety — and the two
# have to be set together or the build refuses.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rand = "0.8"
secrecy = "0.10"
# PKCE for the Antigravity OAuth login: a code_verifier/code_challenge pair,
# nothing that needs a full crypto toolkit.
sha2 = "0.10"
base64 = "0.22"
# The backend is chosen per target below. Enabling `windows-native` on a Mac
# build does not fail loudly — keyring silently falls back to an in-memory store
# that forgets every key on quit, so this has to be right rather than merely
# compile.
keyring = { version = "3", default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
window-vibrancy = "0.6"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
] }

# Keychain, via the Security framework. Same guarantee as DPAPI on Windows:
# encrypted at rest and scoped to the logged-in user, with the OS — not this
# app — deciding when to prompt.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Not a supported target for the packaged app, but `cargo test` on a Linux CI
# runner has to link something. Secret Service is the desktop-standard choice.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
