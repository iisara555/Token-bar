<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The Quoken mark: a Q set in the same dot-matrix the bar uses for every
       reading, so the icon in the tray is the same instrument as the panel it
       opens rather than a logo drawn alongside one.

       A 5x6 lattice on a 112px pitch. The tail is the one lit cell that leaves
       the letter, carried on the diagonal and in the palette's own orange (the
       auth-api token, #ff6a2a): the single point of colour, in the one place
       the shape is already asking the eye to go. -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="#000000"/>

  <g fill="#ffffff">
    <!-- top -->
    <circle cx="400" cy="200" r="48"/>
    <circle cx="512" cy="200" r="48"/>
    <circle cx="624" cy="200" r="48"/>
    <!-- sides -->
    <circle cx="288" cy="312" r="48"/>
    <circle cx="736" cy="312" r="48"/>
    <circle cx="288" cy="424" r="48"/>
    <circle cx="736" cy="424" r="48"/>
    <circle cx="288" cy="536" r="48"/>
    <circle cx="736" cy="536" r="48"/>
    <!-- the row carrying the counter's inner stroke -->
    <circle cx="288" cy="648" r="48"/>
    <circle cx="512" cy="648" r="48"/>
    <circle cx="736" cy="648" r="48"/>
    <!-- bottom -->
    <circle cx="400" cy="760" r="48"/>
    <circle cx="512" cy="760" r="48"/>
    <circle cx="624" cy="760" r="48"/>
  </g>

  <!-- the tail -->
  <circle cx="736" cy="872" r="48" fill="#ff6a2a"/>
</svg>
